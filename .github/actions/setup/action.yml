name: Setup Bun env
description: Configura Node, Bun, caché de node_modules e instala dependencias

inputs:
  node-version:
    description: Versión de Node.js
    required: false
    default: "24.19.0"
  bun-version:
    description: Versión de Bun
    required: false
    default: "1.4.4"
  install-args:
    description: Flags extra para bun install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache node_modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile ${{ inputs.install-args }}
